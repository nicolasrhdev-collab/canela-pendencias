  <meta name="description" content="Painel da montagem dos apartamentos 105 e 306 em Canela.">

  <link rel="stylesheet" href="/styles/tema.css">
  <link rel="stylesheet" href="/styles/componentes.css">
  <link rel="stylesheet" href="/styles/app.css">
  <script>
    /* Tema antes de abrir o app, para não piscar: segue o aparelho, a não ser que a pessoa tenha escolhido. */
    (function () {
      var t = 'claro';
      try {
        var p = localStorage.getItem('canela-tema');
        t = p === 'noturno' || (p !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'noturno' : 'claro';
      } catch (e) {}
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
